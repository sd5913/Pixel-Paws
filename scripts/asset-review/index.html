<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy asset review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eee5e9; color: #514a50; font: 14px system-ui, sans-serif; }
  main { width: min(100%, 430px); margin: auto; }
  header { padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; margin: 8px 0; }
  input[type=range] { width: 160px; vertical-align: middle; }
  #viewport { width: 100%; aspect-ratio: 390 / 844; }
  canvas { display: block; }
  #status { margin: 12px 16px; line-height: 1.5; }
</style>
<main>
  <header>
    <h1>Cozy asset review</h1>
    <label>Asset <select id="asset"></select></label>
    <label>Elevation <input id="elevation" type="range" min="65" max="75" value="70"> <output id="angle">70°</output></label>
    <label>Azimuth <input id="azimuth" type="range" min="-180" max="180" value="30"></label>
    <label><input id="collider" type="checkbox"> Show collider bounds</label>
    <label><input id="desk" type="checkbox"> View at desk scale (1.80 × 0.90 m)</label>
  </header>
  <div id="viewport"></div>
  <p id="status" role="status">Loading approved asset…</p>
</main>
<script type="module" src="./preview.js"></script>
</html>
