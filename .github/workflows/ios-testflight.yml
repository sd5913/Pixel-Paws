name: Upload Pixel Paws to TestFlight
on:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pixel-paws-testflight
  queue: max
jobs:
  upload:
    if: github.repository == 'sd5913/Pixel-Paws' && github.ref == 'refs/heads/main' && github.ref_protected && !github.event.deleted
    environment: pixel-paws-testflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check opt-in
        id: gate
        env:
          ENABLED: ${{ vars.PIXEL_PAWS_TESTFLIGHT_ENABLED }}
        run: |
          if [[ "$ENABLED" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo "IPA_DIR=$RUNNER_TEMP/pixel-paws-ipa" >> "$GITHUB_ENV"
          else
            echo 'TestFlight automation is disabled.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare without Apple credentials
        id: prepare
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            if [[ "$current_main" != "$GITHUB_SHA" ]]; then
              echo 'Retry the newest main run instead of uploading an older revision.' >&2
              exit 1
            fi
          fi
          number="$(node .github/scripts/ios-upload.mjs build-number)"
          echo "build=$number" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          (( ${sdk%%.*} >= 26 ))
          bash .github/scripts/ios-prepare.sh
      - name: Sign and export the IPA
        if: steps.gate.outputs.enabled == 'true'
        env:
          BUILD_NUMBER: ${{ steps.prepare.outputs.build }}
          APPLE_TEAM_ID: ${{ vars.PIXEL_PAWS_APPLE_TEAM_ID }}
          DISTRIBUTION_P12: ${{ secrets.PIXEL_PAWS_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_PASSWORD: ${{ secrets.PIXEL_PAWS_DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PIXEL_PAWS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/ios-testflight.sh
      - name: Upload to App Store Connect
        if: steps.gate.outputs.enabled == 'true'
        env:
          BUILD_NUMBER: ${{ steps.prepare.outputs.build }}
          ASC_KEY: ${{ secrets.PIXEL_PAWS_ASC_INDIVIDUAL_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.PIXEL_PAWS_ASC_INDIVIDUAL_KEY_ID }}
        run: |
          node .github/scripts/ios-upload.mjs upload "$IPA_DIR/PixelPaws.ipa" "$(cat "$IPA_DIR/version")" "$BUILD_NUMBER"
      - name: Remove the local export
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$IPA_DIR"
