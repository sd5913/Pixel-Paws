name: Upload Pixel Paws to TestFlight
on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pixel-paws-testflight
  queue: max
jobs:
  validate-release:
    name: Resolve version and validate commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate version tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$(node .github/scripts/ios-upload.mjs release-version "$GITHUB_REF_NAME")"

            tag_commit="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
            if [[ -z "$tag_commit" ]]; then
              tag_commit="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)"
            fi
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $GITHUB_REF_NAME no longer points to triggering commit $GITHUB_SHA." >&2
              exit 1
            fi
          else
            version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify commit is reachable from protected main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from origin/main." >&2
            exit 1
          fi
          echo "Commit is reachable from main."

  upload:
    needs: [validate-release]
    if: github.repository == 'sd5913/Pixel-Paws' && !github.event.deleted && needs.validate-release.outputs.version != ''
    environment: pixel-paws-testflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check opt-in
        id: gate
        env:
          ENABLED: ${{ vars.PIXEL_PAWS_TESTFLIGHT_ENABLED }}
        run: |
          if [[ "$ENABLED" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo "IPA_DIR=$RUNNER_TEMP/pixel-paws-ipa" >> "$GITHUB_ENV"
          else
            echo 'TestFlight automation is disabled.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare without Apple credentials
        id: prepare
        if: steps.gate.outputs.enabled == 'true'
        run: |
          tag_commit="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)"
          fi
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo 'Tagged commit no longer matches the remote tag ref.' >&2
            exit 1
          fi

          number="$(node .github/scripts/ios-upload.mjs build-number)"
          echo "build=$number" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.validate-release.outputs.version }}" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          (( ${sdk%%.*} >= 26 ))
          bash .github/scripts/ios-prepare.sh
      - name: Sign and export the IPA
        if: steps.gate.outputs.enabled == 'true'
        env:
          BUILD_NUMBER: ${{ steps.prepare.outputs.build }}
          MARKETING_VERSION: ${{ steps.prepare.outputs.version }}
          APPLE_TEAM_ID: ${{ vars.PIXEL_PAWS_APPLE_TEAM_ID }}
          DISTRIBUTION_P12: ${{ secrets.PIXEL_PAWS_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_PASSWORD: ${{ secrets.PIXEL_PAWS_DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PIXEL_PAWS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/ios-testflight.sh
      - name: Upload to App Store Connect
        if: steps.gate.outputs.enabled == 'true'
        env:
          BUILD_NUMBER: ${{ steps.prepare.outputs.build }}
          ASC_KEY: ${{ secrets.PIXEL_PAWS_ASC_INDIVIDUAL_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.PIXEL_PAWS_ASC_INDIVIDUAL_KEY_ID }}
        run: |
          node .github/scripts/ios-upload.mjs upload "$IPA_DIR/PixelPaws.ipa" "$(cat "$IPA_DIR/version")" "$BUILD_NUMBER"
      - name: Remove the local export
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$IPA_DIR"
