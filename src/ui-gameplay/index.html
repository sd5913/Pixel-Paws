<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Paws UI Review</title>
<style>body{margin:0;background:#b9afa6;font-family:system-ui;color:#263441}aside{position:fixed;top:30%;left:12px;z-index:1;max-width:45%;font-size:12px}aside button{display:block;margin:8px 0;padding:8px}#ui{position:fixed;inset:0;z-index:2;pointer-events:none}</style>
<aside>UI review only — simulated notifications, no 3D or physics.
<button id="topple">Simulate topple: cup-1</button><button id="fall">Simulate fall: cup-1</button><button id="clear">Simulate all targets falling</button><p id="event"></p></aside>
<div id="ui"></div>
<script type="module">
import {mountGameUI} from './ui.js';
const targets=[{id:'cup-1'},{id:'cup-2'},{id:'cup-3'}];
const {game}=mountGameUI(document.querySelector('#ui'),{targets,
 resetScene:async()=>{document.querySelector('#event').textContent='Reset requested';},
 onSwat:phase=>{document.querySelector('#event').textContent='Swat: '+phase;}});
document.querySelector('#topple').onclick=()=>game.notifyToppled('cup-1');
document.querySelector('#fall').onclick=()=>game.notifyFallen('cup-1');
document.querySelector('#clear').onclick=()=>targets.forEach(t=>game.notifyFallen(t.id));
</script></html>
