<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#08131f">
    <title>Moonlight Pounce</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-layout">
      <header class="hud">
  <div>
    <p class="eyebrow">PIXEL PAWS / 01</p>
    <h1>Moonlight<br><em>Pounce</em></h1>
  </div>

  <div class="scene-controls">
    <button id="game-mode" type="button">Original Game</button>
    <button id="physics-mode" type="button">Physics Demo</button>
    <button id="start" type="button">Start run</button>
  </div>
</header>

      <div id="game-root" aria-label="3D game arena"></div>

      <footer class="meta">
        <p id="score">Score 0</p>
        <p id="status" role="status">Ready when you are.</p>
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
